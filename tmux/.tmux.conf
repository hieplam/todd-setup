# ────────────────────────────────────────────────────────────────
#  Prefix key
#  Real key is C-a. Karabiner emits C-a on a DOUBLE-TAP of Caps Lock,
#  but ONLY while a terminal app is frontmost (bundle-id gated); a
#  double-tap in any other app types ~ instead. tmux just binds C-a.
#
#  This has TWO halves — BOTH must be present on a machine, or the
#  double-Caps→prefix trick silently won't work:
#    1. Karabiner rule  → karabiner/.config/karabiner/karabiner.json
#       (tracked in this repo; `./install.sh` symlinks it into place).
#       Terminal-agnostic: iTerm2, Terminal.app, Ghostty, Alacritty,
#       kitty, WezTerm, Warp, Hyper, Tabby. Using a terminal not in
#       that list? Add its bundle id to the `bundle_identifiers` array.
#    2. This file → `set -g prefix C-a` so tmux treats C-a as prefix.
#  If double-Caps does nothing on a machine: run `./install.sh` there
#  (it likely never got the Karabiner rule), or the terminal isn't in
#  the bundle-id list above.
# ────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # double-tap the prefix to send a literal C-a

# Number windows (and panes) from 1 (so the number matches the key you press).
set -g base-index 1
setw -g pane-base-index 1
# Auto-close gaps in window numbers when a window is killed.
set -g renumber-windows on

# Reload this config: <prefix> r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ────────────────────────────────────────────────────────────────
#  Vim-style pane switching (under the prefix)
#  <prefix> h/j/k/l → move to the pane left/down/up/right.
#  Note: this overrides the default <prefix> l (last-window).
#  Arrow keys still work too (tmux default <prefix> ←↓↑→).
# ────────────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ────────────────────────────────────────────────────────────────
#  Mouse
#  Click a pane to focus it, drag a border to resize, click a window
#  name in the status bar to select it, scroll to enter copy-mode.
#  Caveat: tmux now owns the mouse, so to select text for the SYSTEM
#  clipboard (not tmux's), hold Option while dragging (iTerm2/most).
# ────────────────────────────────────────────────────────────────
set -g mouse on

# ────────────────────────────────────────────────────────────────
#  Status bar theme
#  Themes are cloned under ~/.tmux/plugins/ but only ONE `run-shell`
#  line below should be uncommented at a time (they all overwrite
#  status-left/right/window-status-format, so loading two at once is
#  just a race to render last). To switch: comment the active line,
#  uncomment another, then <prefix> r to reload.
#
#  rose-pine/tmux, nordtheme/tmux and catppuccin/tmux all name their
#  GitHub repo "tmux", so TPM's `@plugin` mechanism (which derives the
#  install dir from the repo name) can't host more than one of them at
#  once — they'd clobber the same ~/.tmux/plugins/tmux/ dir. Cloned
#  manually into distinct dirs instead and sourced directly via
#  run-shell. tokyo-night-tmux has a unique repo name so it's still
#  managed through TPM (see the plugin block at the end of this file).
# ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5

# --- Rosé Pine ---
# set -g @rose_pine_variant 'main' # 'main', 'moon' or 'dawn'
# set -g @rose_pine_host 'on'
# set -g @rose_pine_date_time '%H:%M'
# Recreates the old "● PREFIX" badge as a prepended left-status segment.
# set -g @rose_pine_status_left_prepend_section "#{?client_prefix,#[fg=colour16,bg=colour208,bold] ● PREFIX #[default],}"
# run-shell ~/.tmux/plugins/rose-pine-tmux/rose-pine.tmux

# --- Nord ---
# run-shell ~/.tmux/plugins/nord-tmux/nord.tmux

# --- Catppuccin ---
# set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
# run-shell ~/.tmux/plugins/catppuccin-tmux/catppuccin.tmux

# --- Tokyo Night (active) ---
# ~/.tmux/prefix-highlight.sh re-sets status-left right after this to flash
# neon yellow (#FFFF00 bg, black fg) on the prefix badge while armed.
set -g @tokyo-night-tmux_theme storm # night | storm | moon | day
set -g @tokyo-night-tmux_show_git 1 # local git branch/status in status-right
set -g @tokyo-night-tmux_show_path 1 # current pane path in status-right
run-shell ~/.tmux/plugins/tokyo-night-tmux/tokyo-night.tmux
run-shell "$HOME/.tmux/prefix-highlight.sh"

# Pane borders — the ACTIVE pane gets a breathing "aura" (animated).
# Thick "heavy" lines give the glow more presence. The color is driven
# by ~/.tmux/pane-aura.sh; the value below is just the pre-animation seed.
# (Prefix mode is still shown by the "● PREFIX" badge in the status bar.)
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# Start the aura animator in the background. The script self-guards
# against duplicates, so re-sourcing this file will not stack instances.
run-shell -b "$HOME/.tmux/pane-aura.sh"

# ────────────────────────────────────────────────────────────────
#  Extended keys (CSI-u) passthrough
#  Lets tmux forward modifier-encoded keys like Shift+Enter to the
#  program inside (e.g. Claude Code) instead of collapsing them to a
#  plain Enter. Requires the OUTER terminal to support it too
#  (iTerm2 / WezTerm / Kitty / Ghostty do; macOS Terminal.app does not).
#  Fallback that always works in any terminal: Ctrl+J for a newline.
# ────────────────────────────────────────────────────────────────
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Force true 24-bit color so hex colors (e.g. the #FFFF00 prefix badge)
# render exactly instead of being downsampled to the nearest 256-color
# approximation. `tmux info` on this box reports RGB/Tc as "missing"
# without this.
set -as terminal-features 'xterm*:RGB'
set -g allow-passthrough on

# ────────────────────────────────────────────────────────────────
#  Focus events passthrough
#  Forwards terminal focus-in/focus-out signals (\e[I / \e[O) to the
#  program inside (e.g. Claude Code) so it can detect pane focus.
# ────────────────────────────────────────────────────────────────
set -g focus-events on

# ────────────────────────────────────────────────────────────────
#  Plugins (TPM — https://github.com/tmux-plugins/tpm)
#  tokyo-night-tmux is a full status-bar theme too (not just widgets),
#  so like nord/catppuccin above it must stay commented-out here
#  unless it's the active theme — otherwise TPM sources it last and
#  it clobbers whatever the "Status bar theme" section set. It's
#  already cloned to ~/.tmux/plugins/tokyo-night-tmux, so switching to
#  it just needs this line uncommented (no reinstall needed) plus
#  commenting out rose-pine's run-shell line above.
#  rose-pine/nord/catppuccin are hand-cloned above (see the Status bar
#  theme section) to avoid a directory-name collision (all three name
#  their repo "tmux"). <prefix> I installs, <prefix> U updates.
# ────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# --- todd-setup: per-machine overrides (untracked) ---
source-file -q ~/.tmux.conf.local
